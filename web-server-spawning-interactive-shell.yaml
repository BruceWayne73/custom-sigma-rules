title: Web Server Spawning Interactive Shell
id: 8c381f01-52a8-4e11-a889-13b78292c608
status: experimental
description: Detects a web server process (Apache, Nginx, Lighttpd, PHP-FPM) spawning a shell or interpreter, which often indicates web shell execution or remote code execution (RCE). T1505.003 - Web Shell, T1059.004 - Unix Shell
references:
    - https://attack.mitre.org/techniques/T1505/003/
    - https://attack.mitre.org/techniques/T1059/004/
author: Arda Aktürk
date: 2026-07-22
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.execution
    - attack.t1059.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/nginx' 
            - '/php-fpm'
            - '/lighttpd'
            - '/caddy'
            - '/uwsgi'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/zsh'
            - '/python'
            - '/python3'
            - '/perl'
            - '/php'
            - '/nc'
            - '/netcat'
            - '/ncat'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate web applications running deliberate system administration scripts via exec() or system() calls
level: high
